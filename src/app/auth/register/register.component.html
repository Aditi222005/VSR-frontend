<div class="auth-page">
  <!-- Mesh background to match the hero -->
  <div class="auth-page__mesh"></div>

  <div class="auth-container">
    <!-- Brand Logo header -->
    <a routerLink="/" class="auth-logo">
      <span class="auth-logo__icon">◈</span>
      <span class="auth-logo__text">StudyRoom</span>
    </a>

    <!-- Auth Card -->
    <div class="auth-card">
      <div class="auth-card__highlight"></div>

      <div class="auth-card__header">
        <h1 class="auth-card__title">Create account</h1>
        <p class="auth-card__subtitle">Start focusing together in under a minute</p>
      </div>

      <!-- Social Register Button (Google) -->
      <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoading()">
        <svg class="btn-google__icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>Sign up with Google</span>
      </button>

      <div class="auth-divider">
        <span class="auth-divider__line"></span>
        <span class="auth-divider__text">or sign up with email</span>
        <span class="auth-divider__line"></span>
      </div>

      <!-- Registration Form -->
      <form (ngSubmit)="onSubmit($event)" class="auth-form">
        <!-- Error Alert -->
        <div *ngIf="errorMessage()" class="auth-alert">
          <span>{{ errorMessage() }}</span>
        </div>

        <!-- Input Field: Name -->
        <div class="form-group">
          <label for="name" class="form-group__label">Full Name</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="name"
              class="form-group__input"
              placeholder="e.g. Alex Rivera"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
              name="name"
              required
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <!-- Input Field: Username -->
        <div class="form-group">
          <label for="username" class="form-group__label">Username</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              class="form-group__input"
              placeholder="e.g. alex_study"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
              name="username"
              required
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <!-- Input Field: Email -->
        <div class="form-group">
          <label for="email" class="form-group__label">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              class="form-group__input"
              placeholder="e.g. alex@university.edu"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              required
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <!-- Input Field: Mobile Number -->
        <div class="form-group">
          <label for="mobile" class="form-group__label">Mobile Number</label>
          <div class="input-wrapper">
            <input
              type="tel"
              id="mobile"
              class="form-group__input"
              placeholder="e.g. +1 (555) 000-0000"
              [ngModel]="mobile()"
              (ngModelChange)="mobile.set($event)"
              name="mobile"
              required
              [disabled]="isLoading()"
            />
          </div>
        </div>

        <!-- Input Field: Password -->
        <div class="form-group">
          <label for="password" class="form-group__label">Password</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              class="form-group__input form-group__input--password"
              placeholder="Min. 8 characters"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              required
              [disabled]="isLoading()"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility"
            >
              {{ showPassword() ? '👁️' : '👁️‍🗨️' }}
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn--primary btn--full btn--lg btn--shine auth-submit" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">Get Started</span>
          <span *ngIf="isLoading()" class="spinner"></span>
        </button>
      </form>

      <!-- Navigation Link to Login -->
      <p class="auth-switch">
        Already have an account?
        <a routerLink="/login" class="auth-switch__link">Log in</a>
      </p>
    </div>

    <!-- Back to home link -->
    <a routerLink="/" class="back-link">
      <span class="back-link__arrow">←</span>
      <span>Back to home</span>
    </a>
  </div>
</div>
